<!DOCTYPE html>
<html>
<head>
    <title>Activity 9 - JS Prompt</title>
    <link rel="stylesheet" href="activity-style.css">
    <script>
    function myFunction() {
        let txt;
        let fullName = prompt("Full name:", "Enter full name here");
        if (fullName == null || fullName == "") {
            txt = "The field is required!";
        } else {
            txt = "Hello, " + fullName + "! How are you today?";
        }
        document.getElementById("demo").innerHTML = txt;
    }
    </script>
</head>
<body>
    <div class="act-nav"><a href="index.html">← Back to Portfolio</a></div>
    <div class="act-container">
        <h2>JavaScript Prompt</h2>
        <button onclick="myFunction()">Click here!</button>
        <p id="demo"></p>
    </div>
</body>
</html>
