<!DOCTYPE html>
<html>
<head>
    <title>Activity 4 - User Information Form</title>
    <link rel="stylesheet" href="activity-style.css">
</head>
<body>
    <div class="act-nav"><a href="index.html">← Back to Portfolio</a></div>
    <div class="act-container">
        <h2>User Information Form</h2>
        <form action="" method="post">
            <label for="fname">First Name:</label><br>
            <input type="text" id="fname" name="firstname" required><br><br>
            <label for="lname">Last Name:</label><br>
            <input type="text" id="lname" name="lastname" required><br><br>
            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age"><br><br>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br><br>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="hobby1" name="hobby" value="Volleyball">
            <label for="hobby1">Volleyball</label><br>
            <input type="checkbox" id="hobby2" name="hobby" value="Gaming">
            <label for="hobby2">Gaming</label><br>
            <input type="checkbox" id="hobby3" name="hobby" value="Eating">
            <label for="hobby3">Eating</label><br>
            <input type="checkbox" id="hobby4" name="hobby" value="Travelling">
            <label for="hobby4">Travelling</label><br>
            <input type="checkbox" id="hobby5" name="hobby" value="Cooking">
            <label for="hobby5">Cooking</label><br><br>
            <label for="year-level">Year Level:</label><br>
            <select id="year-level" name="year_level">
                <option value="1st-year">1st Year</option>
                <option value="2nd-year">2nd Year</option>
                <option value="3rd-year">3rd Year</option>
                <option value="4th-year">4th Year</option>
            </select><br><br>
            <button type="submit">Submit</button>
            <button type="reset">Clear</button>
        </form>
    </div>
</body>
</html>
