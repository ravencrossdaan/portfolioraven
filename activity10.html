<!DOCTYPE html>
<html>
<head>
    <title>Activity 10 - Arithmetic Calculator</title>
    <link rel="stylesheet" href="activity-style.css">
    <script>
    function calculate() {
        let num1 = parseFloat(document.getElementById("num1").value);
        let num2 = parseFloat(document.getElementById("num2").value);
        if (isNaN(num1) || isNaN(num2)) {
            document.getElementById("sum").innerHTML = "Please enter valid numbers.";
            return;
        }
        let result = `
            <b>Addition:</b> ${num1} + ${num2} = ${num1 + num2}<br>
            <b>Subtraction:</b> ${num1} - ${num2} = ${num1 - num2}<br>
            <b>Multiplication:</b> ${num1} × ${num2} = ${num1 * num2}<br>
            <b>Division:</b> ${num1} ÷ ${num2} = ${num2 !== 0 ? (num1 / num2).toFixed(2) : "Cannot divide by zero"}<br>
            <b>Modulus:</b> ${num1} % ${num2} = ${num1 % num2}
        `;
        document.getElementById("sum").innerHTML = result;
    }
    function clearFields() {
        document.getElementById("num1").value = "";
        document.getElementById("num2").value = "";
        document.getElementById("sum").innerHTML = "";
    }
    </script>
</head>
<body>
    <div class="act-nav"><a href="index.html">← Back to Portfolio</a></div>
    <div class="act-container">
        <h2>Arithmetic Operators</h2>
        <form id="sumForm">
            <label for="num1">Number 1:</label><br>
            <input type="text" id="num1" name="num1"><br><br>
            <label for="num2">Number 2:</label><br>
            <input type="text" id="num2" name="num2"><br><br>
            <button type="button" onclick="calculate()">Calculate</button>
            <button type="button" onclick="clearFields()">Clear</button>
        </form>
        <br>
        <p id="sum"></p>
    </div>
</body>
</html>
