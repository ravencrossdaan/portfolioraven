<!DOCTYPE html>
<html>
<head>
    <title>Activity 11 - JavaScript Loops</title>
    <link rel="stylesheet" href="activity-style.css">
    <script>
    function showFor() {
        let count = parseInt(document.getElementById("forCount").value);
        let text = document.getElementById("forText").value;
        let output = document.getElementById("forOutput");
        let result = "";
        if (isNaN(count)) return;
        for (let i = 0; i < count; i++) { result += (i + 1) + ". " + text + "<br>"; }
        output.innerHTML = result;
    }
    function clearFor() { document.getElementById("forForm").reset(); document.getElementById("forOutput").innerHTML = ""; }

    function showWhile() {
        let count = parseInt(document.getElementById("whileCount").value);
        let text = document.getElementById("whileText").value;
        let output = document.getElementById("whileOutput");
        let result = ""; let i = 0;
        if (isNaN(count)) return;
        while (i < count) { result += (i + 1) + ". " + text + "<br>"; i++; }
        output.innerHTML = result;
    }
    function clearWhile() { document.getElementById("whileForm").reset(); document.getElementById("whileOutput").innerHTML = ""; }

    function showDoWhile() {
        let count = parseInt(document.getElementById("dowhileCount").value);
        let text = document.getElementById("dowhileText").value;
        let output = document.getElementById("dowhileOutput");
        let result = "";
        if (isNaN(count) || count <= 0) { output.innerHTML = ""; return; }
        let i = 0;
        do { result += (i + 1) + ". " + text + "<br>"; i++; } while (i < count);
        output.innerHTML = result;
    }
    function clearDoWhile() { document.getElementById("dowhileForm").reset(); document.getElementById("dowhileOutput").innerHTML = ""; }
    </script>
</head>
<body>
    <div class="act-nav"><a href="index.html">← Back to Portfolio</a></div>
    <div class="act-container">
        <div id="forSection">
            <h2>For Loop</h2>
            <form id="forForm">
                <label>Enter Number:</label>
                <input type="number" id="forCount"><br><br>
                <label>Enter Text:</label>
                <input type="text" id="forText"><br><br>
                <button type="button" onclick="showFor()">Show</button>
                <button type="button" onclick="clearFor()">Clear</button>
            </form>
            <div id="forOutput"></div>
        </div>
        <hr>
        <div id="whileSection">
            <h2>While Loop</h2>
            <form id="whileForm">
                <label>Enter Number:</label>
                <input type="number" id="whileCount"><br><br>
                <label>Enter Text:</label>
                <input type="text" id="whileText"><br><br>
                <button type="button" onclick="showWhile()">Show</button>
                <button type="button" onclick="clearWhile()">Clear</button>
            </form>
            <div id="whileOutput"></div>
        </div>
        <hr>
        <div id="DowhileSection">
            <h2>Do-While Loop</h2>
            <form id="dowhileForm">
                <label>Enter Number:</label>
                <input type="number" id="dowhileCount"><br><br>
                <label>Enter Text:</label>
                <input type="text" id="dowhileText"><br><br>
                <button type="button" onclick="showDoWhile()">Show</button>
                <button type="button" onclick="clearDoWhile()">Clear</button>
            </form>
            <div id="dowhileOutput"></div>
        </div>
    </div>
</body>
</html>
